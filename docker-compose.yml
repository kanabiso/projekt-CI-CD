version: "3.9"

services:
  database:
    image: docker.io/bartkek/moviecom-db:latest
    container_name: moviecom-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M

  api:
    image: docker.io/bartkek/moviecom-api:latest
    container_name: moviecom-api
    ports:
      - "9000:9000"
    environment:
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI:-mongodb://database:27017/moviecom}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: wget -q --spider http://127.0.0.1:9000/movies/id/573a1390f29313caabcd4eaf || exit 1
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M

  frontend:
    image: docker.io/bartkek/moviecom-client:latest
    container_name: moviecom-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    
volumes:
  mongo_data:
